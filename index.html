<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AROHA — Oversized Hoodies</title>
  <meta name="description" content="Oversized hoodies, designed in Dhaka. Cash on delivery all over Bangladesh.">
  <meta name="theme-color" content="#0a0a0a">
  <meta property="og:title" content="AROHA — Oversized Hoodies">
  <meta property="og:image" content="https://arohabd.com/images/logo-square.png">
  <meta property="og:description" content="Oversized hoodies, designed in Dhaka. Cash on delivery all over Bangladesh.">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section class="hero" id="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-content">
        <h1 class="hero-word">AROHA</h1>
        <div class="hero-cta">
          <a href="#drop" class="btn btn-light">Shop the drop</a>
          <a href="#lookbook" class="btn btn-outline-light">Lookbook</a>
        </div>
      </div>
    </section>

    <div class="marquee" aria-hidden="true">
      <div class="marquee-track" id="marquee"></div>
    </div>

    <section class="film" id="film">
      <video id="filmVideo" src="media/fabric-hunt.mp4" poster="media/fabric-hunt.jpg"
             muted loop playsinline preload="metadata" aria-label="AROHA fabric hunt video"></video>
      <div class="film-overlay">
        <h2>The fabric hunt</h2>
        <div class="film-cta">
          <a href="#drop" class="btn btn-outline-light">Shop the drop</a>
        </div>
      </div>
      <div class="film-controls">
        <button type="button" id="filmPlay" aria-label="Pause video">
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
        </button>
        <button type="button" id="filmSound" aria-label="Turn sound on" aria-pressed="false">
          <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <svg class="i-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </section>

    <section class="lookbook" id="lookbook" hidden>
      <div class="section-head container">
        <h2>Lookbook</h2>
        <span class="eyebrow muted">Collection 01</span>
      </div>
      <div class="lookbook-grid" id="lookbookGrid"></div>
    </section>

    <section class="section drop" id="drop">
      <div class="section-head">
        <h2>The new drop</h2>
        <a href="shop.html">View all</a>
      </div>
      <div class="drop-grid" id="dropGrid"></div>
    </section>

  </main>
  <div class="lightbox" id="lightbox"><img alt=""></div>
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
